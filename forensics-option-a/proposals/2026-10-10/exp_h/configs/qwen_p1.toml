# Machine configuration for this Khadas Mind 2 (Core Ultra 7 258V, 32 GB, Arc 140V).
# Only machine-specific values live here; everything else comes from hdf/default_config.toml.

[paths]
work_dir = "/home/ubuntu/forensics-option-a/hdf_runs"
attack_stix = "/home/ubuntu/forensics-option-a/data/attack/enterprise-attack.json"

[server]
python = "/home/ubuntu/forensics-option-a/venv_ov2604/bin/python3"
script = "/home/ubuntu/server_tools/openvino_server.py"
device = "GPU"
port = 8086
cleanup_command = ["bash", "/home/ubuntu/clean_memory.sh"]

# Experiment G (2026-10-09): phase-1 triage model = Qwen3.8-27B (official OpenVINO INT4, needs OpenVINO 2026.4+),
# served from a separate venv (venv_ov2604) so the live venv (2026.3.1) is untouched. Settings as Gemma in exp D-F.
[models.triage]
name = "Qwen3.8-27B-OV-INT4"
path = "/home/ubuntu/llama-models/Qwen3.8-27B-OV-INT4"
# Same as Gemma in experiments D-F: thinking off, greedy (model sampling not requested).
enable_thinking = false
# Unmeasured for this model; the Gemma burst rule is kept as the safe default (fresh server per request).
fresh_server_per_request = true

[models.reasoner]
name = "Qwen3.8-27B-OV-INT4"
path = "/home/ubuntu/llama-models/Qwen3.8-27B-OV-INT4"
# Thinking off + schema: 81 s, valid JSON, hypotheses 5/5 grounded. Thinking on: answer cut
# off 4/4 in the first run, 7 min per request when it worked (2026-10-07/08).
enable_thinking = false
# On a server that already served a request, a later prompt took > 6 GB within ~1 s: longer
# than the previous one 3/3, and 7,680 tokens after 12,098 in the first full run. A fresh
# server's first request (2K-12.3K) stayed >= 8.4 GB available 10/10. FoundationSec showed
# no such growth (2026-10-08).
fresh_server_per_request = true

[triage]
# At 12K-token chunks FoundationSec invented command lines and registry keys (all rejected
# by grounding); at 4K it found the target 3/3 without them (2026-10-07).
chunk_evidence_tokens = 4000
